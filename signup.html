<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="EALMS — create an account for leave and attendance self-service.">
    <title>Create account | EALMS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="common.css">
    <link rel="stylesheet" href="signup.css">
</head>
<body class="auth-portal">
    <div class="container">
        <div class="content-wrapper">
            <div class="left-section">
                <p class="eyebrow">EALMS</p>
                <h1>Create your account</h1>
                <p class="lead">Register with your work email so leave, attendance, and approvals stay tied to the correct employee record.</p>
                <div class="illustration" aria-hidden="true">
                    <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" role="img">
                        <rect x="24" y="36" width="152" height="128" rx="12" fill="rgba(74,35,90,0.06)" stroke="rgba(139,71,137,0.28)" stroke-width="2"/>
                        <rect x="24" y="36" width="152" height="36" rx="12" fill="rgba(139,71,137,0.12)"/>
                        <circle cx="52" cy="54" r="4" fill="#4a235a"/>
                        <circle cx="72" cy="54" r="4" fill="rgba(74,35,90,0.35)"/>
                        <circle cx="92" cy="54" r="4" fill="rgba(74,35,90,0.35)"/>
                        <rect x="44" y="92" width="28" height="22" rx="4" fill="rgba(139,71,137,0.45)"/>
                        <rect x="86" y="92" width="28" height="22" rx="4" fill="rgba(139,71,137,0.18)"/>
                        <rect x="128" y="92" width="28" height="22" rx="4" fill="rgba(139,71,137,0.18)"/>
                        <rect x="44" y="124" width="28" height="22" rx="4" fill="rgba(139,71,137,0.18)"/>
                        <rect x="86" y="124" width="28" height="22" rx="4" fill="rgba(139,71,137,0.28)"/>
                        <rect x="128" y="124" width="28" height="22" rx="4" fill="rgba(139,71,137,0.18)"/>
                    </svg>
                </div>
            </div>

            <div class="right-section">
                <div class="signup-form">
                    <h2>Registration</h2>
                    <p class="form-subtitle">Complete the fields below. You will use this email to sign in.</p>
                    <form id="signupForm">
                        <div class="form-group">
                            <label for="name">Full name</label>
                            <input type="text" id="name" name="name" placeholder="Full legal name" autocomplete="name" required>
                        </div>

                        <div class="form-group">
                            <label for="email">Email</label>
                            <input type="email" id="email" name="email" placeholder="name@organization.com" autocomplete="email" required>
                        </div>

                        <div class="form-group">
                            <label for="password">Password</label>
                            <input type="password" id="password" name="password" placeholder="At least 8 characters" autocomplete="new-password" required>
                        </div>

                        <div class="form-group">
                            <label for="confirmPassword">Confirm password</label>
                            <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Re-enter password" autocomplete="new-password" required>
                        </div>

                        <div class="form-group">
                            <label for="picture">Profile photo <span class="optional">optional</span></label>
                            <div class="file-upload">
                                <input type="file" id="picture" name="picture" accept="image/*">
                                <label for="picture" class="file-label">
                                    <svg class="icon icon--sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"/></svg>
                                    <span class="upload-text">Choose image</span>
                                </label>
                            </div>
                        </div>

                        <button type="submit" class="signup-btn">Create account</button>
                    </form>

                    <p class="login-link">Already have an account? <a href="index.html">Sign in</a></p>
                </div>
            </div>
        </div>
    </div>

    <script src="ealms-store.js"></script>
    <script src="signup.js"></script>
</body>
</html>
