<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="EALMS — sign in to manage leave, attendance, and related HR workflows.">
    <title>Sign in | EALMS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="common.css">
    <link rel="stylesheet" href="index.css">
</head>
<body class="auth-portal">
    <div class="container">
        <div class="content-wrapper">
            <div class="left-section">
                <p class="eyebrow">EALMS</p>
                <h1>Leave &amp; attendance management</h1>
                <p class="lead">Submit leave requests, view balances, mark attendance, and review history in one secure workspace.</p>
                <div class="illustration" aria-hidden="true">
                    <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" role="img">
                        <rect x="24" y="36" width="152" height="128" rx="12" fill="rgba(74,35,90,0.06)" stroke="rgba(139,71,137,0.28)" stroke-width="2"/>
                        <rect x="24" y="36" width="152" height="36" rx="12" fill="rgba(139,71,137,0.12)"/>
                        <circle cx="52" cy="54" r="4" fill="#4a235a"/>
                        <circle cx="72" cy="54" r="4" fill="rgba(74,35,90,0.35)"/>
                        <circle cx="92" cy="54" r="4" fill="rgba(74,35,90,0.35)"/>
                        <rect x="44" y="92" width="28" height="22" rx="4" fill="rgba(139,71,137,0.45)"/>
                        <rect x="86" y="92" width="28" height="22" rx="4" fill="rgba(139,71,137,0.18)"/>
                        <rect x="128" y="92" width="28" height="22" rx="4" fill="rgba(139,71,137,0.18)"/>
                        <rect x="44" y="124" width="28" height="22" rx="4" fill="rgba(139,71,137,0.18)"/>
                        <rect x="86" y="124" width="28" height="22" rx="4" fill="rgba(139,71,137,0.28)"/>
                        <rect x="128" y="124" width="28" height="22" rx="4" fill="rgba(139,71,137,0.18)"/>
                    </svg>
                </div>
            </div>

            <div class="right-section">
                <div class="login-form">
                    <h2>Sign in</h2>
                    <p class="form-subtitle">Enter your organizational email and password to continue.</p>
                    <form id="loginForm">
                        <div class="form-group">
                            <label for="email">Email</label>
                            <div class="input-wrapper">
                                <svg class="icon icon--sm input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
                                <input type="email" id="email" name="email" placeholder="name@organization.com" autocomplete="email" required>
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="password">Password</label>
                            <div class="input-wrapper">
                                <svg class="icon icon--sm input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
                                <input type="password" id="password" name="password" placeholder="Password" autocomplete="current-password" required>
                            </div>
                        </div>

                        <div class="form-footer">
                            <a href="reset-password.html" class="forgot-password">Forgot password?</a>
                        </div>

                        <button type="submit" class="login-btn">Sign in</button>
                    </form>

                    <p class="signup-link">No account yet? <a href="signup.html">Create an account</a></p>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            window.location.href = 'dashboard.html';
        });
    </script>
</body>
</html>
